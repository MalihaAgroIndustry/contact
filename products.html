<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Maliha Agro Industry - জৈব সার, ভার্মি কম্পোস্ট, ট্রাইকো কম্পোস্ট ও কৃষি পণ্য।"
    >

    <meta
        name="theme-color"
        content="#1F8F4D"
    >

    <title>
        পণ্যসমূহ | Maliha Agro Industry
    </title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>


<!-- ======================================================
     MAIN CONTAINER
====================================================== -->

<main class="container">


    <!-- ==================================================
         PAGE HEADER
    ================================================== -->

    <section class="contact-header fade-up">

        <h1>
            🌱 আমাদের পণ্যসমূহ
        </h1>

        <p>
            Maliha Agro Industry-এর মানসম্মত জৈব সার ও কৃষি পণ্য
        </p>

    </section>



    <!-- ==================================================
         SEARCH + FILTER
    ================================================== -->

    <section class="card fade-up">


        <!-- SEARCH -->

        <div
            class="search-box"
            style="
                display:flex;
                gap:10px;
                margin-bottom:20px;
            "
        >

            <input
                type="search"
                id="searchProduct"
                placeholder="🔎 পণ্যের নাম লিখে খুঁজুন..."
                aria-label="পণ্য খুঁজুন"
                style="
                    flex:1;
                    padding:15px;
                    border:1px solid #ddd;
                    border-radius:14px;
                    font-size:15px;
                "
            >

        </div>



        <!-- CATEGORY FILTER -->

        <div
            class="filter-buttons"
            style="
                display:flex;
                flex-wrap:wrap;
                gap:10px;
                margin-bottom:20px;
            "
        >

            <button
                type="button"
                class="filter-btn active"
                data-category="all"
                style="
                    padding:11px 18px;
                    border-radius:30px;
                    background:#1F8F4D;
                    color:#fff;
                    font-weight:600;
                "
            >
                🌱 সব পণ্য
            </button>


            <button
                type="button"
                class="filter-btn"
                data-category="organic-fertilizer"
                style="
                    padding:11px 18px;
                    border-radius:30px;
                    background:#e9f8ef;
                    color:#1F8F4D;
                    font-weight:600;
                "
            >
                🌿 জৈব সার
            </button>


            <button
                type="button"
                class="filter-btn"
                data-category="soil-conditioner"
                style="
                    padding:11px 18px;
                    border-radius:30px;
                    background:#e9f8ef;
                    color:#1F8F4D;
                    font-weight:600;
                "
            >
                🪴 মাটি পরিচর্যা
            </button>

        </div>



        <!-- SORT -->

        <div
            class="sort-box"
            style="
                display:flex;
                align-items:center;
                gap:10px;
            "
        >

            <label
                for="sortProducts"
                style="
                    font-weight:600;
                    color:#333;
                "
            >
                ↕️ সাজান:
            </label>


            <select
                id="sortProducts"
                style="
                    padding:11px 15px;
                    border:1px solid #ddd;
                    border-radius:12px;
                    background:#fff;
                "
            >

                <option value="default">
                    ডিফল্ট
                </option>

                <option value="low-high">
                    মূল্য: কম থেকে বেশি
                </option>

                <option value="high-low">
                    মূল্য: বেশি থেকে কম
                </option>

                <option value="new">
                    নতুন পণ্য
                </option>

                <option value="best">
                    বেস্ট সেলার
                </option>

            </select>

        </div>

    </section>



    <!-- ==================================================
         PRODUCT LIST
    ================================================== -->

    <section>

        <div
            id="productList"
            class="products-grid"
        >

            <!-- JavaScript products.json থেকে পণ্য দেখাবে -->

            <div class="card">

                <h2>
                    ⏳ পণ্য লোড হচ্ছে...
                </h2>

                <p>
                    অনুগ্রহ করে একটু অপেক্ষা করুন।
                </p>

            </div>

        </div>

    </section>



    <!-- ==================================================
         DEALER CTA
    ================================================== -->

    <section class="dealer-cta fade-up">

        <div class="dealer-cta-inner">

            <i class="fa-solid fa-store"></i>

            <h2>
                পাইকারি ও ডিলারশিপ
            </h2>

            <p>
                আমাদের জৈব সার ও কৃষি পণ্য পাইকারি মূল্যে নিতে
                অথবা ডিলারশিপ সম্পর্কে জানতে সরাসরি যোগাযোগ করুন।
            </p>


            <div class="dealer-cta-buttons">

                <a
                    href="tel:+8801303679189"
                    class="btn"
                >
                    <i class="fa-solid fa-phone"></i>
                    কল করুন
                </a>


                <a
                    href="https://wa.me/8801303679189"
                    target="_blank"
                    rel="noopener"
                    class="btn"
                >
                    <i class="fa-brands fa-whatsapp"></i>
                    WhatsApp
                </a>

            </div>

        </div>

    </section>


</main>



<!-- ======================================================
     FLOATING WHATSAPP
====================================================== -->

<a
    href="https://wa.me/8801303679189"
    class="whatsapp-float"
    target="_blank"
    rel="noopener"
    aria-label="WhatsApp"
>

    <i class="fa-brands fa-whatsapp"></i>

</a>



<!-- ======================================================
     BOTTOM NAVIGATION
====================================================== -->

<nav
    class="bottom-nav"
    aria-label="প্রধান নেভিগেশন"
>

    <a href="index.html">

        <i class="fa-solid fa-house"></i>

        <span>
            হোম
        </span>

    </a>


    <a
        href="products.html"
        class="active"
    >

        <i class="fa-solid fa-box-open"></i>

        <span>
            পণ্য
        </span>

    </a>


    <a href="wishlist.html">

        <i class="fa-solid fa-heart"></i>

        <span>
            Wishlist
        </span>

    </a>


    <a href="contact.html">

        <i class="fa-solid fa-phone"></i>

        <span>
            যোগাযোগ
        </span>

    </a>

</nav>



<!-- ======================================================
     IMAGE MODAL
====================================================== -->

<div
    id="imageModal"
    class="image-modal"
    role="dialog"
    aria-modal="true"
    aria-label="পণ্যের ছবি"
>

    <button
        type="button"
        class="close-modal"
        aria-label="বন্ধ করুন"
    >
        &times;
    </button>


    <img
        id="modalImage"
        src=""
        alt="Product Preview"
    >

</div>



<!-- ======================================================
     JAVASCRIPT
====================================================== -->

<script
    src="script.js"
    defer
></script>


</body>

</html>
