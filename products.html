<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Maliha Agro Industry - সকল কৃষি পণ্য"
    >

    <meta
        name="theme-color"
        content="#1F8F4D"
    >

    <title>সকল পণ্য | Maliha Agro Industry</title>


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="style.css?v=10"
    >

</head>


<body>


<!-- ======================================================
     MAIN CONTAINER
====================================================== -->

<main class="container">


    <!-- ==================================================
         PAGE HEADER
    ================================================== -->

    <section
        class="page-header fade-up"
        style="
            text-align:center;
            padding:25px 10px 15px;
        "
    >

        <h1>
            🛍️ আমাদের সকল পণ্য
        </h1>

        <p>
            Maliha Agro Industry-এর মানসম্মত কৃষি পণ্যসমূহ
        </p>

    </section>


    <!-- ==================================================
         SEARCH + SORT
    ================================================== -->

    <section
        class="product-tools card"
        style="
            margin:15px 0;
            padding:15px;
        "
    >


        <!-- SEARCH -->

        <div
            class="search-box"
            style="
                position:relative;
                margin-bottom:12px;
            "
        >

            <i
                class="fa-solid fa-magnifying-glass"
                style="
                    position:absolute;
                    left:14px;
                    top:50%;
                    transform:translateY(-50%);
                    color:#777;
                "
            ></i>


            <input
                type="search"
                id="searchProduct"
                placeholder="পণ্যের নাম, ধরন, SKU বা ক্যাটাগরি খুঁজুন..."
                autocomplete="off"
                style="
                    width:100%;
                    padding:13px 15px 13px 42px;
                    border:1px solid #ddd;
                    border-radius:10px;
                    outline:none;
                    font-family:inherit;
                    font-size:14px;
                    box-sizing:border-box;
                "
            >

        </div>


        <!-- SORT -->

        <div
            class="sort-box"
            style="
                display:flex;
                align-items:center;
                gap:8px;
            "
        >

            <label
                for="sortProducts"
                style="
                    font-size:14px;
                    font-weight:600;
                "
            >
                সাজান:
            </label>


            <select
                id="sortProducts"
                style="
                    flex:1;
                    padding:11px;
                    border:1px solid #ddd;
                    border-radius:9px;
                    background:#fff;
                    font-family:inherit;
                    outline:none;
                "
            >

                <option value="default">
                    ডিফল্ট
                </option>

                <option value="low-high">
                    দাম: কম থেকে বেশি
                </option>

                <option value="high-low">
                    দাম: বেশি থেকে কম
                </option>

                <option value="new">
                    নতুন পণ্য
                </option>

                <option value="best">
                    বেস্ট সেলার
                </option>

            </select>

        </div>

    </section>


    <!-- ==================================================
         MAIN CATEGORY BUTTONS
    ================================================== -->

    <section
        class="category-section"
        style="margin:15px 0;"
    >

        <div
            id="mainCategoryButtons"
            class="category-buttons"
            style="
                display:flex;
                gap:8px;
                flex-wrap:wrap;
            "
        >

            <!-- JavaScript এখানে Category Button বসাবে -->

        </div>

    </section>


    <!-- ==================================================
         SUB CATEGORY
    ================================================== -->

    <section
        id="subCategoryArea"
        class="subcategory-area"
    >

        <div
            id="subCategoryButtons"
        >

            <!-- JavaScript -->

        </div>

    </section>


    <!-- ==================================================
         CATEGORY INFORMATION
    ================================================== -->

    <div
        id="categoryInfo"
        class="category-info"
        style="
            display:none;
            margin:15px 0;
            padding:12px 15px;
            border-radius:10px;
            background:#f1f8f3;
            color:#256b3e;
        "
    >
    </div>


    <!-- ==================================================
         PRODUCTS
    ================================================== -->

    <section
        class="products-section"
    >


        <div
            id="productList"
            class="product-grid"
        >

            <!-- ==================================================
                 INITIAL LOADING
            ================================================== -->

            <div
                class="card"
                style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:45px 20px;
                "
            >

                <div
                    style="
                        font-size:45px;
                        margin-bottom:12px;
                    "
                >
                    ⏳
                </div>

                <h2>
                    পণ্য লোড হচ্ছে...
                </h2>

                <p>
                    অনুগ্রহ করে একটু অপেক্ষা করুন।
                </p>

            </div>

        </div>

    </section>


</main>


<!-- ======================================================
     IMAGE PREVIEW MODAL
====================================================== -->

<div
    id="imageModal"
    class="image-modal"
    role="dialog"
    aria-modal="true"
    aria-label="পণ্যের ছবি"
>

    <button
        type="button"
        class="close-modal"
        aria-label="বন্ধ করুন"
    >
        &times;
    </button>


    <img
        id="modalImage"
        src=""
        alt="Product Preview"
    >

</div>


<!-- ======================================================
     FLOATING WHATSAPP
====================================================== -->

<a
    href="https://wa.me/8801303679189"
    class="whatsapp-float"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="WhatsApp"
>

    <i class="fa-brands fa-whatsapp"></i>

</a>


<!-- ======================================================
     BACK TO TOP
====================================================== -->

<button
    id="backToTop"
    class="back-to-top"
    type="button"
    aria-label="উপরে যান"
>
    ⬆
</button>


<!-- ======================================================
     BOTTOM NAVIGATION
====================================================== -->

<nav
    class="bottom-nav"
    aria-label="প্রধান নেভিগেশন"
>


    <a href="index.html">

        <i class="fa-solid fa-house"></i>

        <span>
            হোম
        </span>

    </a>


    <a
        href="products.html"
        class="active"
    >

        <i class="fa-solid fa-box-open"></i>

        <span>
            পণ্য
        </span>

    </a>


    <a href="wishlist.html">

        <i class="fa-solid fa-heart"></i>

        <span id="wishlistCounter">
            Wishlist
        </span>

    </a>


    <a href="contact.html">

        <i class="fa-solid fa-phone"></i>

        <span>
            যোগাযোগ
        </span>

    </a>

</nav>


<!-- ======================================================
     JAVASCRIPT
====================================================== -->

<script
    src="script.js?v=10"
    defer
></script>


</body>

</html>
