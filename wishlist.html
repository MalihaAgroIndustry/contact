<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Maliha Agro Industry - আপনার পছন্দের পণ্য"
    >

    <meta
        name="theme-color"
        content="#1F8F4D"
    >

    <title>
        Wishlist | Maliha Agro Industry
    </title>


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="style.css?v=11"
    >

</head>


<body>


<!-- ======================================================
     MAIN CONTAINER
====================================================== -->

<main class="container">


    <!-- ==================================================
         PAGE HEADER
    ================================================== -->

    <section
        class="page-header fade-up"
        style="
            text-align:center;
            padding:25px 10px 15px;
        "
    >

        <h1>
            ❤️ আমার Wishlist
        </h1>

        <p>
            আপনার পছন্দের পণ্যগুলো এখানে সংরক্ষিত থাকবে।
        </p>

    </section>


    <!-- ==================================================
         WISHLIST SUMMARY
    ================================================== -->

    <section
        class="card"
        style="
            margin:15px 0;
            padding:15px;
            text-align:center;
        "
    >

        <div
            id="wishlistSummary"
            style="
                color:#555;
                font-size:14px;
            "
        >
            ❤️ Wishlist লোড হচ্ছে...
        </div>

    </section>


    <!-- ==================================================
         WISHLIST PRODUCTS
    ================================================== -->

    <section
        class="products-section"
    >

        <div
            id="wishlistProducts"
            class="product-grid"
        >

            <!-- ==================================================
                 INITIAL LOADING
            ================================================== -->

            <div
                class="card"
                style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:45px 20px;
                "
            >

                <div
                    style="
                        font-size:45px;
                        margin-bottom:12px;
                    "
                >
                    ⏳
                </div>

                <h2>
                    Wishlist লোড হচ্ছে...
                </h2>

                <p>
                    অনুগ্রহ করে একটু অপেক্ষা করুন।
                </p>

            </div>

        </div>

    </section>


</main>


<!-- ======================================================
     IMAGE PREVIEW MODAL
====================================================== -->

<div
    id="imageModal"
    class="image-modal"
    role="dialog"
    aria-modal="true"
    aria-label="পণ্যের ছবি"
>

    <button
        type="button"
        class="close-modal"
        aria-label="বন্ধ করুন"
    >
        &times;
    </button>


    <img
        id="modalImage"
        src=""
        alt="Product Preview"
    >

</div>


<!-- ======================================================
     FLOATING WHATSAPP
====================================================== -->

<a
    href="https://wa.me/8801303679189"
    class="whatsapp-float"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="WhatsApp"
>

    <i class="fa-brands fa-whatsapp"></i>

</a>


<!-- ======================================================
     BACK TO TOP
====================================================== -->

<button
    id="backToTop"
    class="back-to-top"
    type="button"
    aria-label="উপরে যান"
>
    ⬆
</button>


<!-- ======================================================
     BOTTOM NAVIGATION
====================================================== -->

<nav
    class="bottom-nav"
    aria-label="প্রধান নেভিগেশন"
>


    <a href="index.html">

        <i class="fa-solid fa-house"></i>

        <span>
            হোম
        </span>

    </a>


    <a href="products.html">

        <i class="fa-solid fa-box-open"></i>

        <span>
            পণ্য
        </span>

    </a>


    <a
        href="wishlist.html"
        class="active"
    >

        <i class="fa-solid fa-heart"></i>

        <span id="wishlistCounter">
            Wishlist
        </span>

    </a>


    <a href="contact.html">

        <i class="fa-solid fa-phone"></i>

        <span>
            যোগাযোগ
        </span>

    </a>

</nav>


<!-- ======================================================
     JAVASCRIPT
====================================================== -->

<script
    src="script.js?v=11"
    defer
></script>


</body>

</html>
