<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Category Management — Maliha Agro Industry</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                "Noto Sans Bengali",
                sans-serif;
            background: #f4f7f5;
            color: #222;
        }

        header {
            background: #168044;
            color: white;
            padding: 18px 20px;
        }

        header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 13px;
            opacity: .9;
        }

        .container {
            width: min(1200px, 94%);
            margin: 25px auto;
        }

        .top-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        button,
        a {
            font-family: inherit;
        }

        .btn {
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 14px;
        }

        .btn-primary {
            background: #168044;
            color: white;
        }

        .btn-secondary {
            background: #e7eee9;
            color: #174b2e;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-warning {
            background: #f0ad4e;
            color: white;
        }

        .btn-small {
            padding: 7px 10px;
            font-size: 12px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
        }

        .card h2 {
            font-size: 18px;
            color: #168044;
            margin-bottom: 15px;
        }

        .category-list {
            display: grid;
            gap: 15px;
        }

        .category-card {
            border: 1px solid #e2e8e4;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }

        .category-header {
            padding: 15px;
            background: #f7faf8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .category-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #e4f4e9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .category-title h3 {
            font-size: 17px;
            margin-bottom: 4px;
        }

        .category-title small {
            color: #777;
        }

        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
        }

        .status.active {
            background: #d9f5e1;
            color: #16733b;
        }

        .status.inactive {
            background: #fce0e3;
            color: #a5202d;
        }

        .category-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .subcategory-area {
            padding: 15px;
            border-top: 1px solid #eee;
        }

        .subcategory-title {
            font-size: 14px;
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
        }

        .subcategory-list {
            display: grid;
            gap: 8px;
        }

        .subcategory-item {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .subcategory-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subcategory-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #777;
        }

        /* Modal */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            background: white;
            width: min(520px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 15px;
            padding: 22px;
        }

        .modal-box h2 {
            color: #168044;
            margin-bottom: 18px;
            font-size: 19px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd6d0;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #168044;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
        }

        .notice {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .notice.show {
            display: block;
        }

        .notice.success {
            background: #dff5e5;
            color: #176b36;
        }

        .notice.error {
            background: #fde2e5;
            color: #9d2633;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 19px;
            }

            .category-header {
                align-items: flex-start;
            }

            .category-actions {
                width: 100%;
            }

            .category-actions .btn {
                flex: 1;
            }

            .subcategory-actions .btn {
                padding: 6px 8px;
                font-size: 11px;
            }

        }
    </style>
</head>

<body>

<header>
    <h1>🌱 Maliha Agro Industry</h1>
    <p>Category & Sub Category Management</p>
</header>

<div class="container">

    <div class="top-actions">

        <a
            href="index.html"
            class="btn btn-secondary"
        >
            🏠 Admin Dashboard
        </a>

        <a
            href="../categories.html"
            class="btn btn-secondary"
            target="_blank"
        >
            👁️ Website Categories
        </a>

        <button
            type="button"
            class="btn btn-primary"
            id="addCategoryBtn"
        >
            ➕ নতুন Category
        </button>

    </div>


    <div
        id="notice"
        class="notice"
    ></div>


    <div class="card">

        <h2>
            📂 Main Categories
        </h2>

        <div
            id="categoryList"
            class="category-list"
        ></div>

    </div>

</div>


<!-- ======================================================
     CATEGORY MODAL
====================================================== -->

<div
    id="categoryModal"
    class="modal"
>

    <div class="modal-box">

        <h2 id="categoryModalTitle">
            ➕ নতুন Category
        </h2>

        <form id="categoryForm">

            <input
                type="hidden"
                id="categoryEditId"
            >

            <div class="form-group">

                <label>
                    Category ID
                </label>

                <input
                    type="text"
                    id="categoryId"
                    placeholder="যেমন: agriculture"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Category Name
                </label>

                <input
                    type="text"
                    id="categoryName"
                    placeholder="যেমন: কৃষি"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Icon / Emoji
                </label>

                <input
                    type="text"
                    id="categoryIcon"
                    placeholder="🌱"
                    value="📂"
                >

            </div>


            <div class="form-group">

                <label>
                    Sort Order
                </label>

                <input
                    type="number"
                    id="categorySortOrder"
                    value="1"
                    min="0"
                >

            </div>


            <div class="form-group">

                <label>
                    Status
                </label>

                <select id="categoryStatus">

                    <option value="active">
                        Active
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                </select>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="cancelCategoryBtn"
                >
                    বাতিল
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    💾 Save Category
                </button>

            </div>

        </form>

    </div>

</div>


<!-- ======================================================
     SUB CATEGORY MODAL
====================================================== -->

<div
    id="subCategoryModal"
    class="modal"
>

    <div class="modal-box">

        <h2 id="subCategoryModalTitle">
            ➕ নতুন Sub Category
        </h2>

        <form id="subCategoryForm">

            <input
                type="hidden"
                id="subCategoryEditId"
            >

            <input
                type="hidden"
                id="subCategoryParentId"
            >


            <div class="form-group">

                <label>
                    Main Category
                </label>

                <input
                    type="text"
                    id="subCategoryParentName"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>
                    Sub Category ID
                </label>

                <input
                    type="text"
                    id="subCategoryId"
                    placeholder="যেমন: organic-fertilizer"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Sub Category Name
                </label>

                <input
                    type="text"
                    id="subCategoryName"
                    placeholder="যেমন: জৈব সার"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Icon / Emoji
                </label>

                <input
                    type="text"
                    id="subCategoryIcon"
                    placeholder="🌱"
                    value="📦"
                >

            </div>


            <div class="form-group">

                <label>
                    Sort Order
                </label>

                <input
                    type="number"
                    id="subCategorySortOrder"
                    value="1"
                    min="0"
                >

            </div>


            <div class="form-group">

                <label>
                    Status
                </label>

                <select id="subCategoryStatus">

                    <option value="active">
                        Active
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                </select>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="cancelSubCategoryBtn"
                >
                    বাতিল
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    💾 Save Sub Category
                </button>

            </div>

        </form>

    </div>

</div>


<script>

"use strict";


/* ==========================================================
   CONFIG
========================================================== */

const CATEGORY_API =
    "../data/categories.json";


let categories = [];


/* ==========================================================
   SHORTCUT
========================================================== */

const $ =
    selector =>
        document.querySelector(selector);


/* ==========================================================
   LOAD CATEGORIES
========================================================== */

async function loadCategories() {

    const list =
        $("#categoryList");


    try {

        const response =
            await fetch(
                CATEGORY_API,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "categories.json load failed"
            );

        }


        const data =
            await response.json();


        if (
            !Array.isArray(data)
        ) {

            throw new Error(
                "categories.json must be an array"
            );

        }


        categories =
            data
                .map(
                    category => {

                        return {

                            ...category,

                            id:
                                String(
                                    category.id || ""
                                )
                                .trim(),

                            name:
                                String(
                                    category.name || ""
                                )
                                .trim(),

                            icon:
                                category.icon ||
                                "📂",

                            status:
                                category.status ||
                                "active",

                            sortOrder:
                                Number(
                                    category.sortOrder || 0
                                ),

                            subCategories:
                                Array.isArray(
                                    category.subCategories
                                )
                                ?
                                category.subCategories.map(
                                    sub => ({

                                        ...sub,

                                        id:
                                            String(
                                                sub.id || ""
                                            )
                                            .trim(),

                                        name:
                                            String(
                                                sub.name || ""
                                            )
                                            .trim(),

                                        icon:
                                            sub.icon ||
                                            "📦",

                                        status:
                                            sub.status ||
                                            "active",

                                        sortOrder:
                                            Number(
                                                sub.sortOrder || 0
                                            )

                                    })
                                )
                                :
                                []

                        };

                    }
                )
                .sort(
                    (a, b) =>
                        a.sortOrder -
                        b.sortOrder
                );


        renderCategories();

    }
    catch(error) {

        console.error(error);


        if (list) {

            list.innerHTML = `

                <div class="empty">

                    ❌ categories.json
                    লোড করা যায়নি।

                    <br><br>

                    নিশ্চিত করুন:

                    <br>

                    <strong>
                        data/categories.json
                    </strong>

                    ফাইলটি আছে।

                </div>

            `;

        }

    }

}


/* ==========================================================
   RENDER CATEGORIES
========================================================== */

function renderCategories() {

    const list =
        $("#categoryList");


    if (!list) return;


    list.innerHTML = "";


    if (!categories.length) {

        list.innerHTML = `

            <div class="empty">

                📂 এখনো কোনো Category নেই।

                <br><br>

                উপরের
                <strong>➕ নতুন Category</strong>
                বাটনে ক্লিক করে যোগ করুন।

            </div>

        `;

        return;

    }


    categories.forEach(
        category => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "category-card";


            const active =
                category.status !==
                "inactive";


            const subCategories =
                Array.isArray(
                    category.subCategories
                )
                ?
                [
                    ...category.subCategories
                ]
                    .sort(
                        (a,b) =>
                            Number(
                                a.sortOrder || 0
                            ) -
                            Number(
                                b.sortOrder || 0
                            )
                    )
                :
                [];


            card.innerHTML = `

                <div
                    class="category-header"
                >

                    <div
                        class="category-title"
                    >

                        <div
                            class="category-icon"
                        >
                            ${
                                category.icon ||
                                "📂"
                            }
                        </div>

                        <div>

                            <h3>
                                ${
                                    escapeHTML(
                                        category.name ||
                                        "Category"
                                    )
                                }
                            </h3>

                            <small>
                                ID:
                                ${
                                    escapeHTML(
                                        category.id
                                    )
                                }

                                &nbsp; • &nbsp;

                                Sort:
                                ${
                                    category.sortOrder
                                }

                                &nbsp; • &nbsp;

                                ${
                                    subCategories.length
                                }
                                Sub Category
                            </small>

                            <br>

                            <span
                                class="
                                    status
                                    ${
                                        active
                                        ? "active"
                                        : "inactive"
                                    }
                                "
                            >
                                ${
                                    active
                                    ? "● Active"
                                    : "● Inactive"
                                }
                            </span>

                        </div>

                    </div>


                    <div
                        class="category-actions"
                    >

                        <button
                            type="button"
                            class="btn btn-primary btn-small"
                            data-action="add-sub"
                            data-id="${escapeAttribute(category.id)}"
                        >
                            ➕ Sub Category
                        </button>

                        <button
                            type="button"
                            class="btn btn-warning btn-small"
                            data-action="edit-category"
                            data-id="${escapeAttribute(category.id)}"
                        >
                            ✏️ Edit
                        </button>

                        <button
                            type="button"
                            class="btn btn-secondary btn-small"
                            data-action="toggle-category"
                            data-id="${escapeAttribute(category.id)}"
                        >
                            ${
                                active
                                ? "⏸️ Inactive"
                                : "▶️ Active"
                            }
                        </button>

                        <button
                            type="button"
                            class="btn btn-danger btn-small"
                            data-action="delete-category"
                            data-id="${escapeAttribute(category.id)}"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </div>


                <div
                    class="subcategory-area"
                >

                    <div
                        class="subcategory-title"
                    >
                        📁 Sub Categories
                    </div>

                    <div
                        class="subcategory-list"
                    >

                        ${
                            subCategories.length
                            ?
                            subCategories
                                .map(
                                    sub =>
                                        renderSubCategory(
                                            category,
                                            sub
                                        )
                                )
                                .join("")
                            :
                            `
                            <div
                                style="
                                    color:#888;
                                    font-size:13px;
                                    padding:10px 0;
                                "
                            >
                                এই Category-তে এখনো
                                কোনো Sub Category নেই।
                            </div>
                            `
                        }

                    </div>

                </div>

            `;


            list.appendChild(
                card
            );

        }
    );


    initCategoryActions();

}


/* ==========================================================
   RENDER SUB CATEGORY
========================================================== */

function renderSubCategory(
    category,
    sub
) {

    const active =
        sub.status !==
        "inactive";


    return `

        <div
            class="subcategory-item"
        >

            <div
                class="subcategory-info"
            >

                <span>
                    ${
                        sub.icon ||
                        "📦"
                    }
                </span>

                <strong>
                    ${
                        escapeHTML(
                            sub.name ||
                            "Sub Category"
                        )
                    }
                </strong>

                <small
                    style="color:#888;"
                >
                    ID:
                    ${
                        escapeHTML(
                            sub.id
                        )
                    }

                    | Sort:
                    ${
                        sub.sortOrder
                    }
                </small>

                <span
                    class="
                        status
                        ${
                            active
                            ? "active"
                            : "inactive"
                        }
                    "
                >
                    ${
                        active
                        ? "Active"
                        : "Inactive"
                    }
                </span>

            </div>


            <div
                class="subcategory-actions"
            >

                <button
                    type="button"
                    class="btn btn-warning btn-small"
                    data-action="edit-sub"
                    data-category="${escapeAttribute(category.id)}"
                    data-sub="${escapeAttribute(sub.id)}"
                >
                    ✏️ Edit
                </button>

                <button
                    type="button"
                    class="btn btn-secondary btn-small"
                    data-action="toggle-sub"
                    data-category="${escapeAttribute(category.id)}"
                    data-sub="${escapeAttribute(sub.id)}"
                >
                    ${
                        active
                        ? "⏸️ Inactive"
                        : "▶️ Active"
                    }
                </button>

                <button
                    type="button"
                    class="btn btn-danger btn-small"
                    data-action="delete-sub"
                    data-category="${escapeAttribute(category.id)}"
                    data-sub="${escapeAttribute(sub.id)}"
                >
                    🗑️ Delete
                </button>

            </div>

        </div>

    `;

}


/* ==========================================================
   CATEGORY ACTIONS
========================================================== */

function initCategoryActions() {

    document
        .querySelectorAll(
            "[data-action]"
        )
        .forEach(
            button => {

                button.onclick =
                    function() {

                        const action =
                            this.dataset.action;


                        const categoryId =
                            this.dataset.id ||
                            this.dataset.category;


                        const subId =
                            this.dataset.sub;


                        switch(action) {

                            case "add-sub":

                                openSubCategoryModal(
                                    categoryId
                                );

                                break;


                            case "edit-category":

                                openCategoryModal(
                                    categoryId
                                );

                                break;


                            case "toggle-category":

                                toggleCategory(
                                    categoryId
                                );

                                break;


                            case "delete-category":

                                deleteCategory(
                                    categoryId
                                );

                                break;


                            case "edit-sub":

                                openSubCategoryModal(
                                    categoryId,
                                    subId
                                );

                                break;


                            case "toggle-sub":

                                toggleSubCategory(
                                    categoryId,
                                    subId
                                );

                                break;


                            case "delete-sub":

                                deleteSubCategory(
                                    categoryId,
                                    subId
                                );

                                break;

                        }

                    };

            }
        );

}


/* ==========================================================
   OPEN CATEGORY MODAL
========================================================== */

function openCategoryModal(
    id = ""
) {

    const modal =
        $("#categoryModal");


    const title =
        $("#categoryModalTitle");


    const category =
        categories.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if (category) {

        title.textContent =
            "✏️ Category Edit";


        $("#categoryEditId").value =
            category.id;


        $("#categoryId").value =
            category.id;


        $("#categoryName").value =
            category.name;


        $("#categoryIcon").value =
            category.icon || "📂";


        $("#categorySortOrder").value =
            category.sortOrder || 0;


        $("#categoryStatus").value =
            category.status || "active";

    }
    else {

        title.textContent =
            "➕ নতুন Category";


        $("#categoryEditId").value =
            "";


        $("#categoryForm").reset();


        $("#categoryIcon").value =
            "📂";


        $("#categoryStatus").value =
            "active";

    }


    modal.classList.add(
        "show"
    );

}


/* ==========================================================
   SAVE CATEGORY
========================================================== */

$("#categoryForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const editId =
                $("#categoryEditId").value
                .trim();


            const id =
                slugify(
                    $("#categoryId").value
                );


            const name =
                $("#categoryName").value
                .trim();


            const icon =
                $("#categoryIcon").value
                .trim() ||
                "📂";


            const sortOrder =
                Number(
                    $("#categorySortOrder").value
                ) || 0;


            const status =
                $("#categoryStatus").value;


            if (!id || !name) {

                showNotice(
                    "Category ID এবং Name অবশ্যই দিতে হবে।",
                    "error"
                );

                return;

            }


            /* EDIT */

            if (editId) {

                const category =
                    categories.find(
                        item =>
                            String(item.id) ===
                            String(editId)
                    );


                if (!category) {

                    showNotice(
                        "Category পাওয়া যায়নি।",
                        "error"
                    );

                    return;

                }


                if (
                    id !== editId &&
                    categories.some(
                        item =>
                            String(item.id) ===
                            String(id)
                    )
                ) {

                    showNotice(
                        "এই Category ID আগে থেকেই আছে।",
                        "error"
                    );

                    return;

                }


                category.id =
                    id;

                category.name =
                    name;

                category.icon =
                    icon;

                category.sortOrder =
                    sortOrder;

                category.status =
                    status;

            }

            /* ADD */

            else {

                if (
                    categories.some(
                        item =>
                            String(item.id) ===
                            String(id)
                    )
                ) {

                    showNotice(
                        "এই Category ID আগে থেকেই আছে।",
                        "error"
                    );

                    return;

                }


                categories.push({

                    id:
                        id,

                    name:
                        name,

                    icon:
                        icon,

                    sortOrder:
                        sortOrder,

                    status:
                        status,

                    subCategories:
                        []

                });

            }


            categories.sort(
                (a,b) =>
                    Number(a.sortOrder || 0) -
                    Number(b.sortOrder || 0)
            );


            closeCategoryModal();

            renderCategories();


            showNotice(
                "Category পরিবর্তন করা হয়েছে।",
                "success"
            );


            showJSON();

        }
    );

/* ==========================================================
   DELETE CATEGORY
========================================================== */

function deleteCategory(id) {

    const category =
        categories.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if (!category) return;


    const subCount =
        Array.isArray(
            category.subCategories
        )
        ?
        category.subCategories.length
        :
        0;


    const message =
        subCount
        ?
        `"${category.name}" Category-এর মধ্যে ${subCount}টি Sub Category আছে।

আপনি কি পুরো Category এবং এর সব Sub Category মুছে ফেলতে চান?`
        :
        `"${category.name}" Category মুছে ফেলতে চান?`;


    if (!confirm(message)) {

        return;

    }


    categories =
        categories.filter(
            item =>
                String(item.id) !==
                String(id)
        );


    renderCategories();

    showNotice(
        "Category মুছে ফেলা হয়েছে।",
        "success"
    );

    showJSON();

}

                .value

            const editId =
                $("#subCategoryEditId")
                .value
                .trim();


            const id =

                Number(

                    .value
                ) || 0;


            const status =

            const category =
                categories.find(
                    item =>

                    );

                    )
                ) {

                    showNotice(
                        "এই Sub Category ID আগে থেকেই আছে।",

                    );

                    return;

                }


                sub.id =
                    id;

                sub.name =
                    name;

                sub.icon =
                    icon;

                sub.sortOrder =
                    sortOrder;

                sub.status =
                    status;

            /* ADD */

            else {

                    showNotice(

            showNotice(

/* ==========================================================
   NOTICE
========================================================== */

function showNotice(
    message,
    type = "success"
) {

    const notice =
        $("#notice");


    if (!notice) return;


    notice.textContent =
        message;


    notice.className =
        "notice show " +
        type;


    clearTimeout(
        showNotice.timer
    );


    showNotice.timer =
        setTimeout(
            function() {

                notice.classList.remove(
                    "show"
                );

            },
            3500
        );

}


/* ==========================================================
   SLUGIFY
========================================================== */

function slugify(value) {

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(
            /[^a-z0-9\u0980-\u09ff]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            ""
        );

}


/* ==========================================================
   ESCAPE HTML
========================================================== */

function escapeHTML(value) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value) {

    return escapeHTML(value);

}
