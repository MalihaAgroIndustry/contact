<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maliha Agro Market — Admin Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #111827;
            padding: 30px 24px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,.35);
        }

        .logo {
            width: 80px;
            height: 80px;
            display: block;
            margin: 0 auto 15px;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            text-align: center;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin: 8px 0 28px;
            font-size: 14px;
        }

        .github-btn {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #24292f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .github-btn:disabled {
            opacity: .6;
        }

        #message {
            min-height: 22px;
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #6b7280;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <img
        src="logo.png"
        alt="Maliha Agro Market"
        class="logo"
    >

    <h1>Maliha Agro Market</h1>

    <p class="subtitle">
        Admin Panel Login
    </p>

    <button
        id="githubLogin"
        class="github-btn"
    >
        Continue with GitHub
    </button>

    <div id="message"></div>

    <div class="footer">
        © Maliha Agro Market
    </div>

</div>

<script src="admin.js"></script>

<script>

const button =
    document.getElementById("githubLogin");

const message =
    document.getElementById("message");


button.addEventListener(
    "click",
    async () => {

        button.disabled = true;

        button.textContent =
            "Connecting to GitHub...";

        message.textContent = "";

        try {

            await window.MalihaAdmin.githubLogin();
            window.location.href = "dashboard.html";

        } catch (error) {

            console.error(error);

            message.style.color =
                "#ef4444";

            message.textContent =
                error.message ||
                "GitHub login failed.";

            button.disabled = false;

            button.textContent =
                "Continue with GitHub";
        }
    }
);

</script>

</body>
</html>
