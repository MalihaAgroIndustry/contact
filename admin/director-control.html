<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Maliha Agro Market — Director Control
    </title>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script src="admin.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6f9;
            color: #17202a;
        }

        .header {
            background: #0f5132;
            color: white;
            padding: 15px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 18px;
        }

        .back-btn {
            border: none;
            background: rgba(255,255,255,.15);
            color: white;
            padding: 9px 13px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .title-box,
        .add-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.07);
        }

        .title-box h2 {
            font-size: 22px;
        }

        .title-box p {
            color: #6b7280;
            margin-top: 7px;
            line-height: 1.5;
        }

        .add-box h3 {
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 14px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .add-btn {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 9px;

            background: #0f5132;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .add-btn:disabled {
            opacity: .6;
        }

        .control-list {

            display: grid;

            gap: 12px;
        }

        .control-card {

            background: white;

            padding: 18px;

            border-radius: 13px;

            box-shadow:
                0 4px 15px rgba(0,0,0,.06);

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }

        .control-info {
            flex: 1;
        }

        .control-info h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .control-key {

            color: #0f5132;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 6px;
        }

        .control-info p {

            color: #6b7280;

            font-size: 13px;

            line-height: 1.4;
        }

        .actions {

            display: flex;

            gap: 7px;
        }

        .action-btn {

            border: none;

            border-radius: 7px;

            padding: 8px 10px;

            cursor: pointer;
        }

        .edit {
            background: #e9ecef;
        }

        .remove {

            background: #dc3545;

            color: white;
        }

        .empty {

            background: white;

            padding: 25px;

            border-radius: 13px;

            text-align: center;

            color: #6b7280;
        }

        #message {

            margin-bottom: 15px;

            padding: 11px;

            border-radius: 8px;

            display: none;

            background: #fff3cd;

            color: #664d03;
        }

        .loading {

            text-align: center;

            color: #6b7280;

            padding: 20px;
        }

        @media(max-width:600px) {

            .container {
                padding: 15px;
            }

            .control-card {

                align-items: flex-start;

                flex-direction: column;
            }

            .actions {

                width: 100%;
            }

            .action-btn {

                flex: 1;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <h1>
        👑 Maliha Agro Market
    </h1>

    <button
        class="back-btn"
        onclick="goBack()"
    >
        ← Back
    </button>

</header>


<main class="container">


    <div class="title-box">

        <h2 id="directorTitle">
            Director Control
        </h2>

        <p id="directorDescription">
            Loading...
        </p>

    </div>


    <div id="message"></div>


    <!-- =========================================
         ADD CONTROL
    ========================================== -->

    <div class="add-box">

        <h3>
            ➕ নতুন Control যোগ করুন
        </h3>


        <div class="form-group">

            <label>
                Control-এর নাম
            </label>

            <input
                type="text"
                id="controlName"
                placeholder="যেমন: Cash Expense"
            >

        </div>


        <div class="form-group">

            <label>
                Control Key
            </label>

            <input
                type="text"
                id="controlKey"
                placeholder="যেমন: cashier.expense"
            >

        </div>


        <div class="form-group">

            <label>
                Description
            </label>

            <textarea
                id="controlDescription"
                placeholder="এই Control কী কাজ করবে লিখুন"
            ></textarea>

        </div>


        <button
            id="addButton"
            class="add-btn"
            onclick="addControl()"
        >
            ➕ Control যোগ করুন
        </button>

    </div>


    <!-- =========================================
         CONTROL LIST
    ========================================== -->

    <div class="add-box">

        <h3>
            📋 বর্তমান Control
        </h3>

        <div
            id="controlList"
            class="control-list"
        >

            <div class="loading">
                Control Loading...
            </div>

        </div>

    </div>


</main>


<script>


/* ==========================================================
   SECTOR
========================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const sector =
    params.get("sector") || "cashier";


/* ==========================================================
   DIRECTOR INFORMATION
========================================================== */

const directorInfo = {

    cashier: {

        title:
            "💰 Cashier Director Control",

        description:
            "আয়, ব্যয়, Payment ও Finance সংক্রান্ত Control।"

    },

    seller: {

        title:
            "🛒 Seller Director Control",

        description:
            "Online ও Offline Sales সংক্রান্ত Control।"

    },

    buyer: {

        title:
            "🛍️ Buyer Director Control",

        description:
            "Online ও Offline Purchase সংক্রান্ত Control।"

    },

    it: {

        title:
            "🖥️ IT Director Control",

        description:
            "Main Admin যে Permission দেবে, IT Director শুধু সেই অনুযায়ী Correction করতে পারবে।"

    }

};


/* ==========================================================
   BACK
========================================================== */

function goBack() {

    window.location.href =
        "director-management.html";

}


/* ==========================================================
   MESSAGE
========================================================== */

function showMessage(
    text,
    success = false
) {

    const message =
        document.getElementById(
            "message"
        );

    message.style.display =
        "block";

    message.textContent =
        text;

    if (success) {

        message.style.background =
            "#d1e7dd";

        message.style.color =
            "#0f5132";

    } else {

        message.style.background =
            "#fff3cd";

        message.style.color =
            "#664d03";

    }

}


/* ==========================================================
   DIRECTOR INFO
========================================================== */

function loadDirectorInfo() {

    const info =
        directorInfo[sector];

    if (!info) {

        showMessage(
            "Director sector পাওয়া যায়নি।"
        );

        return;

    }


    document
        .getElementById(
            "directorTitle"
        )
        .textContent =
        info.title;


    document
        .getElementById(
            "directorDescription"
        )
        .textContent =
        info.description;

}


/* ==========================================================
   LOAD CONTROLS FROM SUPABASE
========================================================== */

async function loadControls() {

    const list =
        document.getElementById(
            "controlList"
        );


    list.innerHTML = `

        <div class="loading">
            Control Loading...
        </div>

    `;


    try {

        const {
            data,
            error
        } =
            await window.supabaseClient

                .from("admin_controls")

                .select("*")

                .ilike(
                    "control_key",
                    sector + ".%"
                )

                .order(
                    "id",
                    {
                        ascending: true
                    }
                );


        if (error) {

            console.error(
                "Control loading error:",
                error
            );

            list.innerHTML = `

                <div class="empty">

                    ❌ Control load করা যায়নি।

                    <br><br>

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            `;

            return;

        }


        if (
            !data ||
            data.length === 0
        ) {

            list.innerHTML = `

                <div class="empty">

                    এই Director-এর কোনো Control পাওয়া যায়নি।

                </div>

            `;

            return;

        }


        list.innerHTML = "";


        data.forEach(
            control => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "control-card";


                card.innerHTML = `

                    <div class="control-info">

                        <h3>
                            ${escapeHtml(
                                control.control_name
                            )}
                        </h3>

                        <div class="control-key">

                            ${escapeHtml(
                                control.control_key
                            )}

                        </div>

                        <p>

                            ${escapeHtml(
                                control.description ||
                                ""
                            )}

                        </p>

                    </div>


                    <div class="actions">

                        <button
                            class="action-btn edit"
                            onclick="editControl(
                                '${control.id}',
                                ${JSON.stringify(
                                    control.control_name
                                )},
                                ${JSON.stringify(
                                    control.control_key
                                )},
                                ${JSON.stringify(
                                    control.description || ""
                                )}
                            )"
                        >
                            ✏️ Edit
                        </button>


                        <button
                            class="action-btn remove"
                            onclick="removeControl(
                                '${control.id}'
                            )"
                        >
                            🗑️ Remove
                        </button>

                    </div>

                `;


                list.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(error);

        list.innerHTML = `

            <div class="empty">

                ❌ Unexpected error হয়েছে।

            </div>

        `;

    }

}


/* ==========================================================
   ADD CONTROL
========================================================== */

async function addControl() {

    const name =
        document
            .getElementById(
                "controlName"
            )
            .value
            .trim();


    const key =
        document
            .getElementById(
                "controlKey"
            )
            .value
            .trim();


    const description =
        document
            .getElementById(
                "controlDescription"
            )
            .value
            .trim();


    if (!name) {

        showMessage(
            "Control-এর নাম লিখুন।"
        );

        return;

    }


    if (!key) {

        showMessage(
            "Control Key দিন।"
        );

        return;

    }


    if (!key.startsWith(
        sector + "."
    )) {

        showMessage(
            "Control Key অবশ্যই " +
            sector +
            ". দিয়ে শুরু হতে হবে।"
        );

        return;

    }


    const button =
        document.getElementById(
            "addButton"
        );


    button.disabled =
        true;

    button.textContent =
        "Saving...";


    try {

        const {
            data,
            error
        } =
            await window.supabaseClient

                .from("admin_controls")

                .insert({

                    control_name:
                        name,

                    control_key:
                        key,

                    description:
                        description

                })

                .select()
                .single();


        if (error) {

            console.error(
                "Control insert error:",
                error
            );

            showMessage(
                "Control Save হয়নি: " +
                error.message
            );

            return;

        }


        showMessage(
            "✅ Control সফলভাবে Save হয়েছে।",
            true
        );


        document
            .getElementById(
                "controlName"
            )
            .value = "";


        document
            .getElementById(
                "controlKey"
            )
            .value = "";


        document
            .getElementById(
                "controlDescription"
            )
            .value = "";


        await loadControls();


    } catch (error) {

        console.error(error);

        showMessage(
            "Control Save করতে সমস্যা হয়েছে।"
        );

    } finally {

        button.disabled =
            false;

        button.textContent =
            "➕ Control যোগ করুন";

    }

}


/* ==========================================================
   EDIT CONTROL
========================================================== */

async function editControl(
    id,
    oldName,
    oldKey,
    oldDescription
) {

    const newName =
        prompt(
            "Control-এর নতুন নাম:",
            oldName
        );


    if (
        newName === null ||
        !newName.trim()
    ) {

        return;

    }


    const newKey =
        prompt(
            "Control Key:",
            oldKey
        );


    if (
        newKey === null ||
        !newKey.trim()
    ) {

        return;

    }


    if (
        !newKey.trim()
            .startsWith(
                sector + "."
            )
    ) {

        showMessage(
            "Control Key অবশ্যই " +
            sector +
            ". দিয়ে শুরু হতে হবে।"
        );

        return;

    }


    const newDescription =
        prompt(
            "Description:",
            oldDescription
        );


    if (newDescription === null) {

        return;

    }


    try {

        const {
            error
        } =
            await window.supabaseClient

                .from("admin_controls")

                .update({

                    control_name:
                        newName.trim(),

                    control_key:
                        newKey.trim(),

                    description:
                        newDescription.trim()

                })

                .eq(
                    "id",
                    id
                );


        if (error) {

            console.error(
                "Control update error:",
                error
            );

            showMessage(
                "Update হয়নি: " +
                error.message
            );

            return;

        }


        showMessage(
            "✅ Control সফলভাবে Update হয়েছে।",
            true
        );


        await loadControls();


    } catch (error) {

        console.error(error);

        showMessage(
            "Control Update করতে সমস্যা হয়েছে।"
        );

    }

}


/* ==========================================================
   REMOVE CONTROL
========================================================== */

async function removeControl(id) {

    const confirmed =
        confirm(
            "এই Control Database থেকে মুছে ফেলতে চান?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const {
            error
        } =
            await window.supabaseClient

                .from("admin_controls")

                .delete()

                .eq(
                    "id",
                    id
                );


        if (error) {

            console.error(
                "Control delete error:",
                error
            );

            showMessage(
                "Delete হয়নি: " +
                error.message
            );

            return;

        }


        showMessage(
            "✅ Control মুছে ফেলা হয়েছে।",
            true
        );


        await loadControls();


    } catch (error) {

        console.error(error);

        showMessage(
            "Control Delete করতে সমস্যা হয়েছে।"
        );

    }

}


/* ==========================================================
   ESCAPE HTML
========================================================== */

function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value == null
            ? ""
            : String(value);

    return div.innerHTML;

}


/* ==========================================================
   START
========================================================== */

loadDirectorInfo();

loadControls();

</script>

</body>

</html>
