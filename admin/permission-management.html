<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maliha Agro Market — Permission Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f6f9;
    color: #17202a;
}

.header {
    background: #0f5132;
    color: white;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.header h1 {
    font-size: 18px;
}

.back-btn {
    border: none;
    background: rgba(255,255,255,.15);
    color: white;
    padding: 9px 13px;
    border-radius: 8px;
    cursor: pointer;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.card h2 {
    margin-bottom: 8px;
}

.card p {
    color: #6b7280;
    line-height: 1.5;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 900px;
    border-collapse: collapse;
}

th,
td {
    padding: 13px 10px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
}

th {
    background: #f3f4f6;
    font-size: 13px;
}

td:first-child,
th:first-child {
    text-align: left;
}

.control-name {
    font-weight: bold;
}

.control-key {
    color: #0f5132;
    font-size: 11px;
    margin-top: 4px;
}

.director-select {
    width: 100%;
    padding: 10px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    margin-bottom: 15px;
}

.permission-box {
    display: flex;
    justify-content: center;
}

.permission-box input {
    width: 20px;
    height: 20px;
    cursor: pointer;
}

.save-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #0f5132;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
}

.save-btn:disabled {
    opacity: .6;
}

.loading {
    text-align: center;
    padding: 25px;
    color: #6b7280;
}

@media(max-width:600px) {
    .container {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header class="header">

    <h1>👑 Maliha Agro Market</h1>

    <button
        class="back-btn"
        onclick="goBack()"
    >
        ← Back
    </button>

</header>

<main class="container">

    <div class="card">

        <h2>🔐 Permission Management</h2>

        <p>
            Main Admin এখান থেকে Director অনুযায়ী
            Control Permission নির্ধারণ করতে পারবে।
        </p>

    </div>

    <div
        id="message"
        class="message"
    ></div>

    <div class="card">

        <h2>👤 Director নির্বাচন করুন</h2>

        <select
            id="directorSelect"
            class="director-select"
            onchange="loadPermissions()"
        >

            <option value="2">
                Director
            </option>

        </select>

        <div
            id="permissionTable"
            class="table-wrap"
        >

            <div class="loading">
                Permission Loading...
            </div>

        </div>

        <button
            id="saveButton"
            class="save-btn"
            onclick="savePermissions()"
        >
            💾 Permission Save করুন
        </button>

    </div>

</main>

<script>

/* ==========================================================
   CURRENT ROLE
========================================================== */

const directorRoleId = 2;


/* ==========================================================
   GO BACK
========================================================== */

function goBack() {

    window.location.href =
        "admin.html";

}


/* ==========================================================
   MESSAGE
========================================================== */

function showMessage(text, success = false) {

    const box =
        document.getElementById("message");

    box.style.display = "block";

    box.textContent = text;

    if (success) {

        box.style.background = "#d1e7dd";
        box.style.color = "#0f5132";

    } else {

        box.style.background = "#fff3cd";
        box.style.color = "#664d03";

    }

}


/* ==========================================================
   LOAD PERMISSIONS
========================================================== */

async function loadPermissions() {

    const table =
        document.getElementById(
            "permissionTable"
        );

    table.innerHTML = `
        <div class="loading">
            Permission Loading...
        </div>
    `;

    try {

        const {
            data: controls,
            error: controlError
        } =
            await window.supabaseClient

                .from("admin_controls")

                .select(`
                    id,
                    control_name,
                    control_key,
                    sector_id
                `)

                .eq(
                    "is_active",
                    true
                )

                .order(
                    "id",
                    {
                        ascending: true
                    }
                );


        if (controlError) {

            throw controlError;

        }


        const {
            data: permissions,
            error: permissionError
        } =
            await window.supabaseClient

                .from(
                    "admin_control_permissions"
                )

                .select(`
                    control_id,
                    can_view,
                    can_create,
                    can_edit,
                    can_delete,
                    can_correct
                `)

                .eq(
                    "role_id",
                    directorRoleId
                )

                .is(
                    "user_id",
                    null
                );


        if (permissionError) {

            throw permissionError;

        }


        const permissionMap = {};


        (permissions || []).forEach(
            item => {

                permissionMap[
                    item.control_id
                ] = item;

            }
        );


        if (
            !controls ||
            controls.length === 0
        ) {

            table.innerHTML = `
                <div class="loading">
                    কোনো Active Control পাওয়া যায়নি।
                </div>
            `;

            return;

        }


        let html = `

            <table>

                <thead>

                    <tr>

                        <th>
                            Control
                        </th>

                        <th>
                            👁️ View
                        </th>

                        <th>
                            ➕ Create
                        </th>

                        <th>
                            ✏️ Edit
                        </th>

                        <th>
                            🗑️ Delete
                        </th>

                        <th>
                            🔧 Correct
                        </th>

                    </tr>

                </thead>

                <tbody>
        `;


        controls.forEach(
            control => {

                const p =
                    permissionMap[
                        control.id
                    ] || {};


                html += `

                    <tr>

                        <td>

                            <div class="control-name">
                                ${escapeHtml(
                                    control.control_name
                                )}
                            </div>

                            <div class="control-key">
                                ${escapeHtml(
                                    control.control_key
                                )}
                            </div>

                        </td>


                        <td>
                            ${checkbox(
                                control.id,
                                "view",
                                p.can_view
                            )}
                        </td>


                        <td>
                            ${checkbox(
                                control.id,
                                "create",
                                p.can_create
                            )}
                        </td>


                        <td>
                            ${checkbox(
                                control.id,
                                "edit",
                                p.can_edit
                            )}
                        </td>


                        <td>
                            ${checkbox(
                                control.id,
                                "delete",
                                p.can_delete
                            )}
                        </td>


                        <td>
                            ${checkbox(
                                control.id,
                                "correct",
                                p.can_correct
                            )}
                        </td>

                    </tr>

                `;

            }
        );


        html += `
                </tbody>
            </table>
        `;


        table.innerHTML = html;


    } catch (error) {

        console.error(
            "Permission load error:",
            error
        );

        table.innerHTML = `
            <div class="loading">
                ❌ Permission Load Error:
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;

    }

}


/* ==========================================================
   CHECKBOX
========================================================== */

function checkbox(
    controlId,
    permission,
    checked
) {

    return `

        <div class="permission-box">

            <input
                type="checkbox"
                data-control="${controlId}"
                data-permission="${permission}"
                ${checked ? "checked" : ""}
            >

        </div>

    `;

}


/* ==========================================================
   SAVE PERMISSIONS
========================================================== */

async function savePermissions() {

    const button =
        document.getElementById(
            "saveButton"
        );

    button.disabled = true;

    button.textContent =
        "Saving...";


    try {

        const checkboxes =
            document.querySelectorAll(
                "#permissionTable input[type='checkbox']"
            );


        const grouped = {};


        checkboxes.forEach(
            checkbox => {

                const controlId =
                    checkbox.dataset.control;

                const permission =
                    checkbox.dataset.permission;


                if (!grouped[controlId]) {

                    grouped[controlId] = {

                        control_id:
                            Number(controlId),

                        role_id:
                            directorRoleId,

                        user_id:
                            null,

                        can_view:
                            false,

                        can_create:
                            false,

                        can_edit:
                            false,

                        can_delete:
                            false,

                        can_correct:
                            false

                    };

                }


                grouped[
                    controlId
                ][
                    "can_" + permission
                ] =
                    checkbox.checked;

            }
        );


        const rows =
            Object.values(
                grouped
            );


        for (
            const row of rows
        ) {

            const {
                error
            } =
                await window.supabaseClient

                    .from(
                        "admin_control_permissions"
                    )

                    .upsert(
                        row,
                        {
                            onConflict:
                                "role_id,control_id"
                        }
                    );


            if (error) {

                throw error;

            }

        }


        showMessage(
            "✅ Permission সফলভাবে Save হয়েছে।",
            true
        );


        await loadPermissions();


    } catch (error) {

        console.error(
            "Permission save error:",
            error
        );

        showMessage(
            "❌ Permission Save হয়নি: " +
            error.message
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "💾 Permission Save করুন";

    }

}


/* ==========================================================
   ESCAPE HTML
========================================================== */

function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value == null
            ? ""
            : String(value);

    return div.innerHTML;

}


/* ==========================================================
   START
========================================================== */

async function startPage() {

    const user =
        await window.MalihaAdmin
            .getCurrentAdmin();


    if (!user) {

        window.location.href =
            "admin.html";

        return;

    }


    await loadPermissions();

}


startPage();

</script>

</body>
</html>
